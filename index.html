<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Michelson 위상 계측 시뮬레이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=STIX+Two+Text:ital,wght@0,400;0,500;1,400;1,500&display=swap">
<style>
/* Layout: instrument console — parameter controls | optics & fringes | calculated readout, graphs underneath */
:root{
  --bg:#edf0f3; --panel:#ffffff; --panel-2:#f5f7f9; --plot-bg:#fbfcfd;
  --ink:#141920; --ink-2:#3e4854; --muted:#687281; --line:#d3d9e0; --grid:#e6eaef;
  --laser:#c41e2a; --laser-soft:#fbe9ea; --on-laser:#ffffff;
  --plot:#2a78d6; --plot-2:#eb6834;
  --ok:#11784c; --ok-soft:#e2f3ea; --warn:#8a5a00; --warn-soft:#fbf1dc;
  --screen:#07090c;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --f-math:"STIX Two Text","Cambria Math","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1014; --panel:#161a20; --panel-2:#1c2128; --plot-bg:#13171c;
    --ink:#e5e9ee; --ink-2:#b3bcc8; --muted:#8792a1; --line:#2c333d; --grid:#222931;
    --laser:#ff5c61; --laser-soft:#3a1b1e; --on-laser:#1a0506;
    --plot:#3987e5; --plot-2:#d95926;
    --ok:#46c28b; --ok-soft:#14301f; --warn:#e3a94a; --warn-soft:#33270f;
    --screen:#030405;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1014; --panel:#161a20; --panel-2:#1c2128; --plot-bg:#13171c;
  --ink:#e5e9ee; --ink-2:#b3bcc8; --muted:#8792a1; --line:#2c333d; --grid:#222931;
  --laser:#ff5c61; --laser-soft:#3a1b1e; --on-laser:#1a0506;
  --plot:#3987e5; --plot-2:#d95926;
  --ok:#46c28b; --ok-soft:#14301f; --warn:#e3a94a; --warn-soft:#33270f;
  --screen:#030405;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:1500px;margin:0 auto;padding-inline:20px;padding-block:14px 48px}
@media (max-width:600px){.app{padding-inline:16px}}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--plot);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.kicker{font:600 11px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--laser)}
h1{margin:2px 0 0;font-size:21px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--ink-2)}
.chain .node{border:1px solid var(--line);background:var(--panel);padding:2px 8px;border-radius:3px;white-space:nowrap}
.chain .arr{color:var(--muted);font-family:var(--f-mono)}

/* tabs */
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:12px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tab{appearance:none;border:1px solid transparent;border-bottom:none;background:none;padding:9px 14px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;border-radius:5px 5px 0 0;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--panel);border-color:var(--line);color:var(--ink)}
.tab .no{font-family:var(--f-mono);color:var(--laser);margin-right:7px;font-weight:600}
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.subtab{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:4px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.subtab[aria-selected="true"]{border-color:var(--ink);color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--laser)}
.subtab .no{font-family:var(--f-mono);margin-right:6px;color:var(--laser)}

/* work grid */
.work{display:grid;grid-template-columns:minmax(250px,292px) minmax(0,1fr) minmax(280px,350px);gap:12px;align-items:start;margin-top:14px}
@media (max-width:1200px){.work{grid-template-columns:minmax(250px,300px) minmax(0,1fr)}.work>.col-vals{grid-column:1/-1}.col-vals .panel-b{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}}
@media (max-width:800px){.work{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);min-height:40px}
.panel-h h3{margin:0;font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.panel-b{padding:12px;display:flex;flex-direction:column;gap:14px}
.graphs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
@media (max-width:800px){.graphs{grid-template-columns:minmax(0,1fr)}}

/* controls */
.ctl-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ctl label{font-size:13px}
.ctl-num{display:flex;align-items:center;gap:4px;flex:none}
.ctl-num input{width:88px;font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:var(--panel-2)}
.unit{font:12px var(--f-mono);color:var(--muted);min-width:44px}
input[type=range]{width:100%;accent-color:var(--laser);margin:6px 0 0;cursor:pointer}
.ctl-note{font-size:11.5px;color:var(--muted);margin-top:2px}
.ctl-group{display:flex;flex-direction:column;gap:6px}
.ctl-group>.lbl{font-size:12px;color:var(--ink-2);font-weight:500}
.btn{border:1px solid var(--line);background:var(--panel-2);padding:5px 10px;border-radius:4px;cursor:pointer;font-size:12.5px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--laser);border-color:var(--laser);color:var(--on-laser)}
.btn.sm{padding:3px 8px;font-size:12px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:none;background:var(--panel-2);padding:5px 8px;font-size:12.5px;cursor:pointer;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--panel);font-weight:600}
.swatch{display:inline-block;width:12px;height:12px;border-radius:2px;border:1px solid var(--line);vertical-align:-2px;margin-right:4px}

/* values */
.vals{margin:0;display:flex;flex-direction:column}
.vrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:5px 0;border-bottom:1px dashed var(--grid)}
.vrow:last-child{border-bottom:none}
.vrow dt{font-size:12.5px;color:var(--ink-2)}
.vrow dt small{display:block;font-size:11px;color:var(--muted)}
.vrow dd{margin:0;font:500 13.5px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere}
.vrow.hl dd{color:var(--laser);font-weight:600}
.calc{background:var(--panel-2);border:1px solid var(--grid);border-radius:4px;padding:8px 10px;overflow-x:auto}
.calc-t{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-weight:600}
.calc-g{display:grid;grid-template-columns:auto 1fr;column-gap:8px;row-gap:1px;font:12.5px var(--f-mono);font-variant-numeric:tabular-nums}
.calc-l{font-family:var(--f-math);font-style:italic;font-size:14.5px;white-space:nowrap}
.calc-r{white-space:nowrap}
.calc-r.res{color:var(--laser);font-weight:600}
.calc-gap{grid-column:1/-1;height:6px}

/* formulas */
.formula{font-family:var(--f-math);font-size:17px;display:flex;flex-wrap:wrap;gap:8px 26px;align-items:center;line-height:1.3}
.formula .eq{white-space:nowrap}
.formula .eq.key{color:var(--laser)}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;font-size:.92em}
.frac>span:first-child{border-bottom:1px solid currentColor;padding:0 3px}
.frac>span:last-child{padding:0 3px}
.m{font-family:var(--f-math);font-style:italic}
.mono{font-family:var(--f-mono)}

/* plot */
.plot{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 10px 6px;min-width:0}
.plot figcaption{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;font-size:12.5px;margin-bottom:2px}
.plot-t{font-weight:600}
.plot-r{font:500 12px var(--f-mono);color:var(--laser);font-variant-numeric:tabular-nums}
.plot-w{width:100%;overflow:hidden;touch-action:pan-y}
.plot svg{display:block}
.plot text.tick{font:10.5px var(--f-mono);fill:var(--muted)}
.plot text.axl{font:12px var(--f-ui);fill:var(--ink-2)}
.plot line.grid{stroke:var(--grid);stroke-width:1}
.plot .frame{fill:none;stroke:var(--line)}
.plot .curline{stroke:var(--laser);stroke-dasharray:4 3;stroke-width:1.2}
.plot .hline{stroke:var(--muted);stroke-dasharray:2 4;stroke-width:1}
.plot text.hlabel{font:10px var(--f-mono);fill:var(--muted)}
.plot .xhair{stroke:var(--ink-2);stroke-width:1;opacity:.55}
.plot .tip rect{fill:var(--ink)}
.plot .tip text{font:11px var(--f-mono);fill:var(--panel)}
.plot-n{font-size:11.5px;color:var(--muted);margin:2px 2px 2px}

/* notes */
.simp{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink-2);background:var(--warn-soft);border:1px solid var(--line);border-radius:4px;padding:7px 9px}
.simp-tag{flex:none;font:600 10.5px var(--f-mono);letter-spacing:.03em;color:var(--warn);border:1px solid currentColor;border-radius:3px;padding:0 5px;margin-top:1px}
.interp{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-top:12px}
.interp h3{margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.interp p,.interp li{max-width:82ch;margin:0 0 8px;line-height:1.65}
.interp ul{margin:0 0 8px;padding-left:20px}
.interp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:4px 28px}

.canvas-wrap{width:100%;min-width:0}
.canvas-wrap canvas{display:block;max-width:100%}
.viz-cap{font-size:12px;color:var(--ink-2);line-height:1.5}
.viz-cap b{font-family:var(--f-mono);font-weight:600;color:var(--laser)}
.viz-row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.viz-row>*{min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.meter{height:8px;border-radius:4px;background:var(--grid);overflow:hidden}
.meter>span{display:block;height:100%;background:var(--laser)}

.bigphase{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2)}
.bigphase .val{font:600 30px var(--f-math);letter-spacing:-.01em}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:4px;font:600 13px var(--f-mono);border:1px solid var(--line);color:var(--muted)}
.badge.on{background:var(--laser);color:var(--on-laser);border-color:var(--laser);font-size:15px}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}

/* summary */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table.sum{border-collapse:collapse;width:100%;min-width:900px;font-size:13px}
table.sum th,table.sum td{padding:9px 12px;border-bottom:1px solid var(--grid);text-align:left;vertical-align:top}
table.sum th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);background:var(--panel-2);font-weight:600}
table.sum td.f{font-family:var(--f-math);font-size:16px;white-space:nowrap}
table.sum td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12.5px}
table.sum tr:last-child td{border-bottom:none}
.x2{display:inline-block;font:600 11px var(--f-mono);padding:1px 6px;border-radius:3px;background:var(--laser-soft);color:var(--laser);margin-left:6px;vertical-align:2px}
.keyline{margin-top:14px;padding:18px 20px;border:2px solid var(--laser);border-radius:6px;background:var(--laser-soft);font-size:18px;font-weight:600;line-height:1.5;text-wrap:balance}
.keyline small{display:block;font-size:13px;font-weight:400;color:var(--ink-2);margin-top:4px}
.flow{display:flex;flex-direction:column;align-items:stretch;gap:0;max-width:640px}
.flow .st{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:10px 12px}
.flow .st .k{font:600 12px var(--f-mono);color:var(--laser);padding-top:2px}
.flow .st .t{font-weight:600}
.flow .st .d{font-size:12.5px;color:var(--ink-2)}
.flow .st .ex{font:12px var(--f-mono);color:var(--ink);margin-top:3px;overflow-wrap:anywhere}
.flow .dn{text-align:center;color:var(--muted);font-size:16px;line-height:22px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:12px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.loading{padding:40px 20px;color:#6a7482;font-family:system-ui,sans-serif}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
</style>

</head>
<body>
<div id="root"><div class="loading">시뮬레이터를 불러오는 중…</div></div>
<noscript>이 시뮬레이션은 JavaScript가 필요합니다.</noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.2/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useId } = React;

/* ================================================================
   1. UNITS — every internal length is in SI metres
   ================================================================ */
const NM = 1e-9, UM = 1e-6, MM = 1e-3;
const PI = Math.PI, TAU = 2 * Math.PI;

/* ================================================================
   2. CORE PHYSICS — every phase in this program comes from ONE relation:
        Δφ = (2π/λ) · OPD          N = OPD/λ = Δφ/2π
   Each phenomenon only supplies its own OPD model.
   ================================================================ */
const phaseFromOPD = (opd, lam) => TAU * opd / lam;
const fringeNumber = (opd, lam) => opd / lam;
const twoBeam = (I1, I2, dphi) => I1 + I2 + 2 * Math.sqrt(I1 * I2) * Math.cos(dphi);

const OPD = {
  doublePassIndex: (L, dn) => 2 * L * dn,   // Michelson: sample traversed twice
  singlePassIndex: (L, dn) => L * dn,       // birefringence, MZI arm
  reflection:      (dz) => 2 * dz,          // mirror / surface moved by dz
  filmRoundTrip:   (n, d) => 2 * n * d,     // thin film, normal incidence
};

/* ================================================================
   3. FORMATTING
   ================================================================ */
const SUPMAP = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
const sup = n => String(n).split('').map(c => SUPMAP[c] || c).join('');
const minus = s => s.replace(/^-/, '−');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function sci(x, sig = 3) {
  if (!isFinite(x)) return '—';
  if (x === 0) return '0';
  let e = Math.floor(Math.log10(Math.abs(x)));
  let m = (x / Math.pow(10, e)).toFixed(sig - 1);
  if (Math.abs(+m) >= 10) { e += 1; m = (x / Math.pow(10, e)).toFixed(sig - 1); }
  return `${minus(m)}×10${sup(e)}`;
}
function fnum(x, sig = 4) {
  if (!isFinite(x)) return '—';
  if (x === 0) return '0';
  const a = Math.abs(x);
  if (a >= 1e4 || a < 1e-3) return sci(x, sig);
  const s = x.toPrecision(sig);
  return s.includes('e') ? sci(x, sig) : minus(s);
}
const fix = (x, d) => minus(x.toFixed(d));
function fLen(m, sig = 4) {
  if (!isFinite(m)) return '—';
  if (m === 0) return '0 nm';
  const a = Math.abs(m);
  const U = [[1, 'm'], [1e-3, 'mm'], [1e-6, 'μm'], [1e-9, 'nm'], [1e-12, 'pm']];
  for (const [u, n] of U) if (a >= u * 0.99995) return `${fnum(m / u, sig)} ${n}`;
  return `${sci(m, sig)} m`;
}
const fPi = x => `${fnum(x / PI, 4)}π`;
function niceTicks(a, b, n = 5) {
  if (a > b) [a, b] = [b, a];
  const span = (b - a) || 1;
  const raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), r = raw / mag;
  const step = (r < 1.5 ? 1 : r < 3 ? 2 : r < 7 ? 5 : 10) * mag;
  const t = [];
  for (let v = Math.ceil(a / step - 1e-9) * step; v <= b + step * 1e-9; v += step) t.push(Math.abs(v) < step * 1e-9 ? 0 : v);
  return { ticks: t, step };
}
function tickFmt(v, step) {
  if (v === 0) return '0';
  const a = Math.abs(v);
  if (a >= 1e5 || a < 1e-4) return sci(v, 2);
  const d = clamp(-Math.floor(Math.log10(step) + 1e-9), 0, 6);
  return fix(v, d);
}
function parseNum(s) {
  const t = String(s).trim().replace(/[−–]/g, '-').replace(/\s/g, '').replace(/[×x]10\^?/i, 'e');
  if (t === '') return null;
  const v = Number(t);
  return isFinite(v) ? v : null;
}

/* wavelength → display colour (visible band); IR shown as false colour */
function wlColor(nm) {
  let r = 0, g = 0, b = 0;
  if (nm >= 380 && nm < 440) { r = -(nm - 440) / 60; b = 1; }
  else if (nm >= 440 && nm < 490) { g = (nm - 440) / 50; b = 1; }
  else if (nm >= 490 && nm < 510) { g = 1; b = -(nm - 510) / 20; }
  else if (nm >= 510 && nm < 580) { r = (nm - 510) / 70; g = 1; }
  else if (nm >= 580 && nm < 645) { r = 1; g = -(nm - 645) / 65; }
  else if (nm >= 645 && nm <= 780) { r = 1; }
  if (nm > 780) return { rgb: [0.78, 0.16, 0.2], ir: true, css: 'rgb(199,41,51)' };
  if (nm < 380) return { rgb: [0.5, 0, 1], ir: true, css: 'rgb(128,0,255)' };
  const mx = Math.max(r, g, b) || 1;
  const rgb = [r / mx, g / mx, b / mx];
  return { rgb, ir: false, css: `rgb(${rgb.map(v => Math.round(255 * Math.pow(v, 0.8))).join(',')})` };
}

/* ================================================================
   4. HOOKS
   ================================================================ */
function useWidth(ref, fallback = 500) {
  const [w, setW] = useState(fallback);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const ro = new ResizeObserver(es => { const cw = es[0].contentRect.width; if (cw > 0) setW(Math.floor(cw)); });
    ro.observe(el); return () => ro.disconnect();
  }, []);
  return w;
}
function useThemeKey() {
  const [k, setK] = useState(0);
  useEffect(() => {
    const f = () => setK(x => x + 1);
    const mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
    mq && mq.addEventListener && mq.addEventListener('change', f);
    const mo = new MutationObserver(f);
    mo.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    return () => { mq && mq.removeEventListener && mq.removeEventListener('change', f); mo.disconnect(); };
  }, []);
  return k;
}
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const REDUCED = typeof window !== 'undefined' && window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function useRaf(active, cb) {
  const ref = useRef(cb); ref.current = cb;
  useEffect(() => {
    if (!active) return;
    let id, last = performance.now();
    const loop = now => { const dt = Math.min(0.05, (now - last) / 1000); last = now; ref.current(dt); id = requestAnimationFrame(loop); };
    id = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(id);
  }, [active]);
}
function setupCanvas(cv, w, h) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = Math.round(w * dpr), H = Math.round(h * dpr);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, dpr, W, H };
}

/* generic function plot: axis labels + units, grid, current marker, numeric readout, hover crosshair */
function Plot({ title, f, x0, x1, xScale = 1, xLabel, yLabel, yDomain, yFmt = v => fnum(v, 4), xFmt, cur, readout,
  hlines = [], samples = 1200, height = 240, color = 'var(--plot)', note }) {
  const wrap = useRef(null);
  const W = useWidth(wrap, 520);
  const uid = useId().replace(/[^a-zA-Z0-9]/g, '');
  const [hover, setHover] = useState(null);
  const m = { l: 58, r: 16, t: 12, b: 42 };
  const iw = Math.max(40, W - m.l - m.r), ih = height - m.t - m.b;
  const pts = [];
  for (let i = 0; i <= samples; i++) { const x = x0 + (x1 - x0) * i / samples; pts.push([x, f(x)]); }
  let y0, y1;
  if (yDomain) [y0, y1] = yDomain;
  else {
    let lo = Infinity, hi = -Infinity;
    for (const p of pts) if (isFinite(p[1])) { lo = Math.min(lo, p[1]); hi = Math.max(hi, p[1]); }
    if (cur && isFinite(cur.y)) { lo = Math.min(lo, cur.y); hi = Math.max(hi, cur.y); }
    if (!isFinite(lo)) { lo = 0; hi = 1; }
    if (hi - lo < 1e-15) { const c = Math.abs(lo) || 1; lo -= 0.5 * c; hi += 0.5 * c; }
    const pad = (hi - lo) * 0.08; y0 = lo - pad; y1 = hi + pad;
  }
  const X = x => m.l + (x - x0) / (x1 - x0) * iw;
  const Y = y => m.t + (1 - (y - y0) / (y1 - y0)) * ih;
  const xt = niceTicks(x0 / xScale, x1 / xScale, Math.max(3, Math.floor(iw / 85)));
  const yt = niceTicks(y0, y1, Math.max(3, Math.floor(ih / 38)));
  const lim = 20 * (y1 - y0);
  const d = 'M' + pts.map(p => X(p[0]).toFixed(1) + ',' + Y(clamp(p[1], y0 - lim, y1 + lim)).toFixed(1)).join('L');
  const xf = xFmt || (v => fnum(v / xScale, 4));
  const onMove = e => {
    const r = e.currentTarget.getBoundingClientRect();
    const px = (e.clientX - r.left) * (W / r.width);
    if (px < m.l || px > m.l + iw) { setHover(null); return; }
    const x = x0 + (px - m.l) / iw * (x1 - x0);
    setHover({ x, y: f(x) });
  };
  const curIn = cur && cur.x >= x0 && cur.x <= x1;
  let tip = null;
  if (hover) {
    const hx = X(hover.x), hy = Y(clamp(hover.y, y0, y1));
    const label = `${xf(hover.x)} , ${yFmt(hover.y)}`;
    const tw = label.length * 6.6 + 12;
    const tx = hx + 10 + tw > m.l + iw ? hx - 10 - tw : hx + 10;
    const ty = clamp(hy - 26, m.t, m.t + ih - 20);
    tip = (
      <g pointerEvents="none">
        <line className="xhair" x1={hx} x2={hx} y1={m.t} y2={m.t + ih} />
        <circle cx={hx} cy={hy} r="3.5" fill="var(--ink)" />
        <g className="tip"><rect x={tx} y={ty} width={tw} height="19" rx="3" /><text x={tx + 6} y={ty + 13}>{label}</text></g>
      </g>
    );
  }
  return (
    <figure className="plot">
      <figcaption><span className="plot-t">{title}</span>{readout && <span className="plot-r">{readout}</span>}</figcaption>
      <div ref={wrap} className="plot-w">
        <svg width={W} height={height} viewBox={`0 0 ${W} ${height}`} role="img" aria-label={title}
          onPointerMove={onMove} onPointerLeave={() => setHover(null)}>
          <defs><clipPath id={'c' + uid}><rect x={m.l} y={m.t} width={iw} height={ih} /></clipPath></defs>
          <rect x={m.l} y={m.t} width={iw} height={ih} fill="var(--plot-bg)" />
          {xt.ticks.map(t => (
            <g key={'x' + t}>
              <line className="grid" x1={X(t * xScale)} x2={X(t * xScale)} y1={m.t} y2={m.t + ih} />
              <text className="tick" x={X(t * xScale)} y={m.t + ih + 14} textAnchor="middle">{tickFmt(t, xt.step)}</text>
            </g>
          ))}
          {yt.ticks.map(t => (
            <g key={'y' + t}>
              <line className="grid" x1={m.l} x2={m.l + iw} y1={Y(t)} y2={Y(t)} />
              <text className="tick" x={m.l - 6} y={Y(t) + 3.5} textAnchor="end">{tickFmt(t, yt.step)}</text>
            </g>
          ))}
          <g clipPath={`url(#c${uid})`}>
            {hlines.filter(h => h.y >= y0 && h.y <= y1).map((h, i) => (
              <g key={'h' + i}>
                <line className="hline" x1={m.l} x2={m.l + iw} y1={Y(h.y)} y2={Y(h.y)} />
                <text className="hlabel" x={m.l + 4} y={Y(h.y) - 3}>{h.label}</text>
              </g>
            ))}
            <path d={d} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" />
            {curIn && <line className="curline" x1={X(cur.x)} x2={X(cur.x)} y1={m.t} y2={m.t + ih} />}
          </g>
          <rect className="frame" x={m.l} y={m.t} width={iw} height={ih} />
          {curIn && isFinite(cur.y) && cur.y >= y0 && cur.y <= y1 &&
            <circle cx={X(cur.x)} cy={Y(cur.y)} r="5.5" fill="var(--laser)" stroke="var(--panel)" strokeWidth="2" />}
          {tip}
          <text className="axl" x={m.l + iw / 2} y={height - 6} textAnchor="middle">{xLabel}</text>
          <text className="axl" transform={`translate(14 ${m.t + ih / 2}) rotate(-90)`} textAnchor="middle">{yLabel}</text>
        </svg>
      </div>
      {note && <div className="plot-n">{note}</div>}
    </figure>
  );
}
function scaleFor(maxAbs) {

/* ================================================================

const T1_DEFAULT = { lambda_nm: 632.8, L_mm: 1, n0: 1.5, dn: 2e-4, I1: 1, I2: 1 };
function computeT1(s) {
  const lam = s.lambda_nm * NM, L = s.L_mm * MM;
  const opl0 = s.n0 * L;
  const dOPL = OPD.singlePassIndex(L, s.dn);
  const opd = OPD.doublePassIndex(L, s.dn);
  const dphi = phaseFromOPD(opd, lam);
  const N = fringeNumber(opd, lam);
  const I = twoBeam(s.I1, s.I2, dphi);
  const Imax = Math.pow(Math.sqrt(s.I1) + Math.sqrt(s.I2), 2);
  const V = s.I1 + s.I2 > 0 ? 2 * Math.sqrt(s.I1 * s.I2) / (s.I1 + s.I2) : 0;
  return { lam, L, opl0, dOPL, opd, dphi, N, I, Imax, In: Imax > 0 ? I / Imax : 0, V };
}

/* circular fringes: phase at radius r = Δφ − 2πK(r/R)² (increasing OPD ⇒ rings are born at the centre) */
function FringeRings({ dphi, N, I1, I2, lamNm }) {
  const wrap = useRef(null), cv = useRef(null);
  const w = useWidth(wrap, 280);
  const theme = useThemeKey();
  const S = clamp(w, 180, 300);
  const K = 5;
  useEffect(() => {
    const c = cv.current; if (!c) return;
    const { ctx, dpr, W } = setupCanvas(c, S, S);
    const img = ctx.createImageData(W, W);
    const [cr, cg, cb] = wlColor(lamNm).rgb;
    const Imax = Math.pow(Math.sqrt(I1) + Math.sqrt(I2), 2) || 1;
    const R = W / 2 * 0.96, cx = W / 2;
    const bg = [7, 9, 12];
    for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
      const r2 = ((x - cx) ** 2 + (y - cx) ** 2) / (R * R);
      const i = (y * W + x) * 4;
      if (r2 > 1) { img.data[i] = bg[0]; img.data[i + 1] = bg[1]; img.data[i + 2] = bg[2]; img.data[i + 3] = 255; continue; }
      const In = twoBeam(I1, I2, dphi - TAU * K * r2) / Imax;
      const v = Math.pow(clamp(In, 0, 1), 0.85) * 255;
      img.data[i] = cr * v; img.data[i + 1] = cg * v; img.data[i + 2] = cb * v; img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const Rc = S / 2 * 0.96, c0 = S / 2;
    // reference positions of bright rings at Δn = 0
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1;
    ctx.font = '10px "IBM Plex Mono", monospace'; ctx.textAlign = 'center';
    ctx.beginPath(); ctx.moveTo(c0, c0); ctx.lineTo(c0 + Rc, c0); ctx.globalAlpha = .35; ctx.stroke(); ctx.globalAlpha = 1;
    for (let k = 1; k <= K; k++) {
      const rk = Rc * Math.sqrt(k / K);
      ctx.beginPath(); ctx.moveTo(c0 + rk, c0 - 5); ctx.lineTo(c0 + rk, c0 + 5); ctx.stroke();
      if (k < K) ctx.fillText(String(k), c0 + rk, c0 + 16);
    }
    // tracked fringe: the bright ring born most recently at the centre (order m = ⌊N⌋)
    const frac = N - Math.floor(N);
    const rt = Rc * Math.sqrt(frac / K);
    ctx.setLineDash([5, 4]); ctx.lineWidth = 1.6; ctx.strokeStyle = 'rgba(255,255,255,.95)';
    ctx.beginPath(); ctx.arc(c0, c0, Math.max(rt, 1.5), 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(c0 - 6, c0); ctx.lineTo(c0 + 6, c0); ctx.moveTo(c0, c0 - 6); ctx.lineTo(c0, c0 + 6); ctx.stroke();
  }, [dphi, N, I1, I2, lamNm, S, theme]);
  return (
    <div ref={wrap} className="canvas-wrap" style={{ maxWidth: 300 }}>
      <canvas ref={cv} role="img" aria-label={`원형 간섭무늬, fringe 이동 ${fnum(N, 3)}`} />
    </div>
  );
}

function Tab1({ s, set }) {
  const c = computeT1(s);
  const up = k => v => set(p => ({ ...p, [k]: v }));
  const [sweep, setSweep] = useState(false);
  useRaf(sweep, dt => set(p => { let dn = p.dn + dt * 1e-3 / 12; if (dn > 1e-3) dn = 0; return { ...p, dn }; }));
  const col = wlColor(s.lambda_nm);
  const fA = dn => phaseFromOPD(OPD.doublePassIndex(c.L, dn), c.lam);
  const fB = dn => twoBeam(s.I1, s.I2, fA(dn)) / (c.Imax || 1);
  const maxPh = fA(1e-3);
  const nLines = Math.floor(maxPh / TAU);
  const hl = nLines <= 10 ? Array.from({ length: nLines }, (_, i) => ({ y: TAU * (i + 1), label: `N=${i + 1} (${i + 1}·2π)` })) : [];
  const frac = c.N - Math.floor(c.N);

            <Slider id="t1-dn" label="굴절률 변화 Δn" value={s.dn} onChange={up('dn')} min={0} max={10} step={0.001} scale={1e-4} dec={3} unit="×10⁻⁴" />
            <Slider id="t1-I1" label="광 세기 I₁ (reference)" value={s.I1} onChange={up('I1')} min={0} max={2} step={0.01} dec={2} unit="a.u." />
            <Slider id="t1-I2" label="광 세기 I₂ (sample)" value={s.I2} onChange={up('I2')} min={0} max={2} step={0.01} dec={2} unit="a.u." />
            <div className="btnrow">
              <button type="button" className={'btn' + (sweep ? ' primary' : '')} onClick={() => setSweep(v => !v)}>{sweep ? '■ 스윕 정지' : '▶ Δn 스윕 (0 → 1×10⁻³)'}</button>
            </div>
          </Panel>
        </div>

        <div className="col">
          <Panel title="Optical schematic · fringe view">
            <div className="formula">
              <span className="eq">OPL = <i>nL</i></span>
              <span className="eq">Δ(OPL) = <i>L</i>Δ<i>n</i></span>
              <span className="eq key">OPD = 2<i>L</i>Δ<i>n</i></span>
              <span className="eq">Δ<i>φ</i> = <Fr n="2π" d={<i>λ</i>} />·OPD = <Fr n={<>4π<i>L</i>Δ<i>n</i></>} d={<i>λ</i>} /></span>
              <span className="eq"><i>N</i> = <Fr n="OPD" d={<i>λ</i>} /> = <Fr n={<>Δ<i>φ</i></>} d="2π" /></span>
            </div>
            <div className="viz-row">
              <div style={{ flex: '1 1 260px' }}><MichelsonSchematic lamNm={s.lambda_nm} dn={s.dn} L_mm={s.L_mm} /></div>
              <div style={{ flex: '0 1 300px', display: 'flex', flexDirection: 'column', gap: 8 }}>
                <FringeRings dphi={c.dphi} N={c.N} I1={s.I1} I2={s.I2} lamNm={s.lambda_nm} />
                <div className="viz-cap">
                  N = <b>{fix(c.N, 3)}</b> · 중심에서 새로 생긴 fringe <b>{Math.floor(c.N + 1e-9)}</b>개,
                  점선 고리는 가장 최근에 생긴 밝은 fringe로 한 주기 중 <b>{fix(frac, 3)}</b>만큼 이동했다.
                  눈금 1–4는 Δn = 0일 때의 밝은 고리 위치. N이 1 증가하면 점선 고리가 눈금 1에 도달한다.
                </div>
                <div>
                  <div className="viz-cap" style={{ marginBottom: 3 }}>중심 검출기 세기 I/I<sub>max</sub> = <b>{fix(c.In, 3)}</b></div>
                  <div className="meter"><span style={{ width: `${clamp(c.In, 0, 1) * 100}%` }} /></div>
                </div>
              </div>
            </div>
            <Simplified>
              고리 간격(링 반경 분포)은 표시용이며, 중심의 위상과 고리 이동량만 계산 결과(Δφ)와 정량적으로 연결되어 있다.
              Δn = 0에서 두 팔의 광경로가 같아 중심이 밝다고 두었다. 실제 장치에서는 거울 기울기, 빔 발산, 시료 표면 반사·분산이 무늬 모양을 바꾼다.

        <div className="col col-vals">

              { k: 'Δn', v: sci(s.dn, 3) },
              { k: 'OPL₀ = n₀L', sub: '초기 단일 통과 광경로', v: fLen(c.opl0) },
              { k: 'Δ(OPL) = LΔn', sub: '단일 통과 광경로 변화', v: fLen(c.dOPL) },
              { k: 'OPD = 2LΔn', sub: 'Michelson 왕복 광경로차', v: fLen(c.opd), hl: true },
              { k: 'Δφ', sub: '위상 변화', v: `${fnum(c.dphi, 4)} rad`, hl: true },
              { k: 'Δφ / 2π', v: `${fnum(c.dphi / TAU, 4)} cycle` },
              { k: 'N = OPD/λ', sub: '이동한 fringe 수', v: fnum(c.N, 4), hl: true },
              { k: 'Δφ = 2πN 확인', v: `2π×${fnum(c.N, 4)} = ${fnum(TAU * c.N, 4)} rad` },
              { k: 'I', sub: '현재 간섭 세기', v: `${fnum(c.I, 4)} a.u.` },
              { k: 'I / I_max', v: fix(c.In, 4) },
              { k: 'Visibility V', sub: '2√(I₁I₂)/(I₁+I₂)', v: fix(c.V, 3) },
            ]} />
            <Calc lines={[
              ['OPD', '= 2LΔn'],
              ['', `= 2 × (${fLen(c.L)}) × (${sci(s.dn, 4)})`],
              ['', `= ${fLen(c.opd)}`, true],
              null,
              ['Δφ', '= (2π/λ)·OPD = 4πLΔn / λ'],
              ['', `= 4π(${fLen(c.L)})(${sci(s.dn, 4)}) / (${fLen(c.lam)})`],
              ['', `= ${fnum(c.dphi, 4)} rad`, true],
              null,
              ['N', '= OPD / λ'],
              ['', `= (${fLen(c.opd)}) / (${fLen(c.lam)}) = ${fnum(c.N, 4)}`, true],
              null,
              ['I', '= I₁ + I₂ + 2√(I₁I₂) cos Δφ'],
              ['', `= ${fix(s.I1, 2)} + ${fix(s.I2, 2)} + 2√(${fix(s.I1, 2)}·${fix(s.I2, 2)}) cos(${fnum(c.dphi, 4)})`],
              ['', `= ${fnum(c.I, 4)} a.u.`, true],
            ]} />
          </Panel>
        </div>
      </div>

      <div className="graphs">
        <Plot title="Graph A · 위상 변화 Δφ vs Δn" f={fA} x0={0} x1={1e-3} xScale={1e-4}
          xLabel="굴절률 변화 Δn (×10⁻⁴)" yLabel="Δφ (rad)" cur={{ x: s.dn, y: c.dphi }}
          readout={`Δn = ${sci(s.dn, 3)} → Δφ = ${fnum(c.dphi, 4)} rad`} hlines={hl} samples={300}
          yFmt={v => `${fnum(v, 4)} rad`} xFmt={v => `Δn=${sci(v, 3)}`}
          note="점선: Δφ = 2π의 정수배 = fringe 한 개씩 이동한 지점" />
        <Plot title="Graph B · 정규화 간섭 세기 vs Δn" f={fB} x0={0} x1={1e-3} xScale={1e-4} yDomain={[0, 1.05]}
          xLabel="굴절률 변화 Δn (×10⁻⁴)" yLabel="I / I_max" cur={{ x: s.dn, y: c.In }} samples={2400}
          readout={`I/I_max = ${fix(c.In, 4)}`} yFmt={v => `I/Imax=${fix(v, 3)}`} xFmt={v => `Δn=${sci(v, 3)}`}
          note={`I_max = (√I₁+√I₂)² = ${fnum(c.Imax, 4)} a.u. · 밝음→어둠→밝음 한 주기 = Δn 변화 λ/(2L) = ${sci(c.lam / (2 * c.L), 3)}`} />
      </div>

      <Interp>
        <div>
          <p>굴절률이 증가하면 빛은 같은 물리적 길이 <i>L</i>을 지나는 동안 더 많은 파장 수를 겪는다. 즉 optical path length <span className="m">OPL = nL</span>이 증가한다. 기준 팔(M₂)은 그대로이므로 두 팔 사이의 optical path difference가 변하고, 이것이 위상차로 나타난다.</p>
          <p>Michelson 간섭계에서는 빛이 시료를 <b>갈 때 한 번, 거울에서 반사되어 돌아올 때 한 번</b> 지나므로 광경로차는 <span className="m">2LΔn</span>이다. 이 factor 2 때문에 같은 Δn에 대해 단일 통과 장치(예: Mach–Zehnder)보다 위상 변화가 두 배 크다.</p>
        </div>
        <div>
          <p>위상차가 2π만큼 변할 때 OPD는 정확히 한 파장 λ만큼 변하므로 무늬가 한 개 이동한다. 따라서 중심에서 생겨난 fringe 수를 세면 <span className="m">Δn = Nλ/(2L)</span>로 굴절률 변화를 얻는다. 현재 설정에서 fringe 한 개는 Δn = {sci(c.lam / (2 * c.L), 3)}에 해당한다.</p>
          <p>n₀는 절대 광경로(OPL₀)만 바꾸고 fringe <i>이동</i>에는 들어가지 않는다. 측정되는 것은 굴절률의 <i>변화</i>이다. 실제로 시료가 가열되어 Δn이 생기면 열팽창으로 <i>L</i>도 변하므로 OPD = 2Δ(nL) ≈ 2(LΔn + nΔL)을 함께 고려해야 한다.</p>
        </div>
      </Interp>
    </>
  );
}

/* ================================================================
   TAB 2 — optical anisotropy & birefringence
   ================================================================ */
const T2_DEFAULT = { mode: 'xy', lambda_nm: 632.8, L_mm: 1, nx: 1.5, ny: 1.499, analyzer: 'crossed' };
const T2_PRESETS = [
  { name: '기본값', nx: 1.5, ny: 1.499 },
  { name: 'Quartz', nx: 1.5517, ny: 1.5427, note: 'α-SiO₂, n_e/n_o @633 nm' },
  { name: 'Calcite', nx: 1.4852, ny: 1.6557, note: 'CaCO₃, n_e/n_o @633 nm' },
  { name: 'LiNbO₃', nx: 2.2030, ny: 2.2860, note: 'n_e/n_o @633 nm' },
  { name: '응력 Si (예시)', nx: 3.88002, ny: 3.88, note: '응력 유기 Δn ≈ 2×10⁻⁵, 예시값' },
];
function computeT2(s) {
  const lam = s.lambda_nm * NM, L = s.L_mm * MM;
  const dn = s.nx - s.ny;
  const opd = OPD.singlePassIndex(L, dn);
  const dphi = phaseFromOPD(opd, lam);
  const N = fringeNumber(opd, lam);
  const I = s.analyzer === 'parallel' ? Math.cos(dphi / 2) ** 2 : Math.sin(dphi / 2) ** 2;
  const aN = Math.abs(N), order = Math.floor(aN + 1e-9), fr = aN - order;
  const near = (a, b) => Math.abs(a - b) < 0.01;
  let plate = '일반 retarder (타원 편광)';
  if (near(fr, 0) || near(fr, 1)) plate = order === 0 && near(fr, 0) ? '위상차 없음' : 'full-wave (λ) — 편광 유지';
  else if (near(fr, 0.25)) plate = 'λ/4 retardation (quarter-wave)';
  else if (near(fr, 0.5)) plate = 'λ/2 retardation (half-wave)';
  else if (near(fr, 0.75)) plate = '3λ/4 ≡ λ/4 (회전 방향 반대)';
  const md = ((dphi % TAU) + TAU) % TAU;
  const pol = Math.abs(Math.sin(md)) < 0.03 ? '선형 편광' : Math.abs(Math.cos(md)) < 0.03 ? '원형 편광' : '타원 편광';
  return { lam, L, dn, opd, dphi, N, I, order, fr, plate, md, pol, navg: (s.nx + s.ny) / 2 };
}

function PolWaves({ dphi, playing, dn }) {
  const wrap = useRef(null), cv = useRef(null);
  const W = useWidth(wrap, 560);
  const H = 220;
  const theme = useThemeKey();
  const t = useRef(0);
  const draw = () => {
    const c = cv.current; if (!c) return;
    const { ctx } = setupCanvas(c, W, H);
    const col = { x: cssVar('--plot'), y: cssVar('--plot-2'), ink: cssVar('--ink-2'), muted: cssVar('--muted'), line: cssVar('--line'), p2: cssVar('--panel-2'), bg: cssVar('--panel') };
    ctx.clearRect(0, 0, W, H);
    const narrow = W < 460;
    const ellW = narrow ? 0 : Math.min(170, W * 0.3);
    const wavW = W - ellW - (narrow ? 0 : 14);
    const z1 = wavW * 0.28, z2 = wavW * 0.72, cy = H / 2 + 6, A = H * 0.28;
    const k = TAU / 46, nvis = 1.7, om = TAU * 0.5, tt = t.current;
    ctx.fillStyle = col.p2; ctx.strokeStyle = col.line; ctx.lineWidth = 1;
    ctx.fillRect(z1, 22, z2 - z1, H - 34); ctx.strokeRect(z1 + .5, 22.5, z2 - z1 - 1, H - 35);
    ctx.fillStyle = col.muted; ctx.font = '11px "IBM Plex Sans KR", sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('결정 (nₓ, nᵧ) · 두께 L', (z1 + z2) / 2, 16);
    ctx.textAlign = 'left'; ctx.fillText('입사: 동위상', 4, 16);
    ctx.textAlign = 'right'; ctx.fillText('출사: 상대 위상 Δφ', wavW - 2, 16);
    ctx.strokeStyle = col.line; ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(wavW, cy); ctx.stroke();
    const base = z => k * (z + (nvis - 1) * clamp(z - z1, 0, z2 - z1));
    const sfrac = z => clamp((z - z1) / (z2 - z1), 0, 1);
    const wave = (extra, color) => {
      ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
      for (let z = 0; z <= wavW; z += 1.5) {
        const y = cy - A * Math.sin(base(z) - om * tt - extra(z));
        z === 0 ? ctx.moveTo(z, y) : ctx.lineTo(z, y);
      }
      ctx.stroke();
    };
    wave(() => 0, col.y);
    wave(z => dphi * sfrac(z), col.x);
    if (!narrow) {
      const ex = W - ellW / 2, r = Math.min(ellW / 2 - 16, H / 2 - 34), ey = cy - 4;
      ctx.strokeStyle = col.line; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(ex - r - 6, ey); ctx.lineTo(ex + r + 6, ey); ctx.moveTo(ex, ey - r - 6); ctx.lineTo(ex, ey + r + 6); ctx.stroke();
      ctx.strokeStyle = col.ink; ctx.lineWidth = 1.8; ctx.beginPath();
      for (let i = 0; i <= 200; i++) { const tau = TAU * i / 200; const X = ex + r * Math.cos(tau - dphi), Y = ey - r * Math.cos(tau); i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }
      ctx.stroke();
      const tau = om * tt; const X = ex + r * Math.cos(tau - dphi), Y = ey - r * Math.cos(tau);
      ctx.fillStyle = cssVar('--laser'); ctx.beginPath(); ctx.arc(X, Y, 4, 0, TAU); ctx.fill();
      ctx.fillStyle = col.muted; ctx.textAlign = 'center'; ctx.font = '11px "IBM Plex Sans KR", sans-serif';
      ctx.fillText('출사 편광 (Eₓ, Eᵧ)', ex, 16);
      ctx.font = '10px "IBM Plex Mono", monospace';
      ctx.fillText('Eₓ →', ex + r - 2, ey + r + 18 > H - 2 ? H - 2 : ey + r + 18);
    }
  };
  useRaf(playing, dt => { t.current += dt; draw(); });
  useEffect(() => { draw(); }, [dphi, W, theme, playing]);
  return <div ref={wrap} className="canvas-wrap"><canvas ref={cv} role="img" aria-label={`x, y 편광 성분 파동. 상대 위상 ${fnum(dphi, 3)} rad`} /></div>;
}

function Tab2({ s, set }) {
  const c = computeT2(s);
  const up = k => v => set(p => ({ ...p, [k]: v }));
  const [play, setPlay] = useState(!REDUCED);
  const setAvg = v => set(p => { const d = p.nx - p.ny; return { ...p, nx: v + d / 2, ny: v - d / 2 }; });
  const setDn = d => set(p => { const a = (p.nx + p.ny) / 2; return { ...p, nx: a + d / 2, ny: a - d / 2 }; });
  const setRetard = frac => set(p => { const a = (p.nx + p.ny) / 2; const d = frac * p.lambda_nm * NM / (p.L_mm * MM); return { ...p, nx: a + d / 2, ny: a - d / 2 }; });
  // graph domains (zoom when the fringe density would alias)
  const a = Math.max(2e-3, 1.2 * Math.abs(c.dn));
  const scA = scaleFor(a);
  let gx0 = -a, gx1 = a, zoom = false;
  if (2 * a * c.L / c.lam > 80) { const hw = 6 * c.lam / c.L; gx0 = c.dn - hw; gx1 = c.dn + hw; zoom = true; }
  const scB = zoom ? scaleFor(Math.max(Math.abs(gx0), Math.abs(gx1))) : scA;
  const fA = dn => phaseFromOPD(OPD.singlePassIndex(c.L, dn), c.lam);
  const fB = dn => { const p = fA(dn); return s.analyzer === 'parallel' ? Math.cos(p / 2) ** 2 : Math.sin(p / 2) ** 2; };
  const nWaves = c.navg * c.L / c.lam;
  return (
    <>
      <div className="work">
        <div className="col">
          <Panel title="Parameter controls" right={<ResetBtn onClick={() => set(T2_DEFAULT)} />}>
            <div className="ctl-group"><span className="lbl">입력 방식</span>
              <Seg label="입력 방식" value={s.mode} onChange={up('mode')} options={[{ v: 'xy', l: 'nₓ, nᵧ 입력' }, { v: 'avg', l: 'n_avg, Δn 입력' }]} />
            </div>
            <Slider id="t2-lam" label="파장 λ" value={s.lambda_nm} onChange={up('lambda_nm')} min={400} max={1000} step={0.1} dec={1} unit="nm" />
            <Slider id="t2-L" label="결정 두께 L" value={s.L_mm} onChange={up('L_mm')} min={0.01} max={10} step={0.001} dec={3} unit="mm" hardMin={0.001} />
            {s.mode === 'xy' ? <>
              <Slider id="t2-nx" label="nₓ (x 편광)" value={s.nx} onChange={up('nx')} min={1.3} max={4} step={0.00001} dec={5} unit="" hardMin={1} hardMax={5} />
              <Slider id="t2-ny" label="nᵧ (y 편광)" value={s.ny} onChange={up('ny')} min={1.3} max={4} step={0.00001} dec={5} unit="" hardMin={1} hardMax={5} />
            </> : <>
              <Slider id="t2-navg" label="n_avg = (nₓ+nᵧ)/2" value={c.navg} onChange={setAvg} min={1.3} max={4} step={0.0001} dec={5} unit="" hardMin={1} hardMax={5} />
              <Slider id="t2-dn" label="Δn = nₓ − nᵧ" value={c.dn} onChange={setDn} min={-10} max={10} step={0.001} scale={1e-3} dec={4} unit="×10⁻³" hardMin={-300} hardMax={300} />
            </>}
            <div className="ctl-group"><span className="lbl">Retarder 바로 설정 (n_avg 유지, zero-order)</span>
              <div className="btnrow">
                <button type="button" className="btn sm" onClick={() => setRetard(0.25)}>λ/4</button>
                <button type="button" className="btn sm" onClick={() => setRetard(0.5)}>λ/2</button>
                <button type="button" className="btn sm" onClick={() => setRetard(1)}>λ</button>
              </div>
            </div>
            <div className="ctl-group"><span className="lbl">결정 예시 (x ∥ 광학축, λ = 633 nm 값)</span>
              <div className="btnrow">
                {T2_PRESETS.map(p => <button key={p.name} type="button" className="btn sm" title={p.note || ''} onClick={() => set(q => ({ ...q, nx: p.nx, ny: p.ny, lambda_nm: 632.8 }))}>{p.name}</button>)}
              </div>
            </div>
            <div className="ctl-group"><span className="lbl">검광자 (편광자는 x축에서 45°)</span>
              <Seg label="검광자" value={s.analyzer} onChange={up('analyzer')} options={[{ v: 'crossed', l: '직교 (⊥)' }, { v: 'parallel', l: '평행 (∥)' }]} />
            </div>
          </Panel>
        </div>

        <div className="col">
          <Panel title="Polarization components in the crystal" right={<button type="button" className="btn sm" onClick={() => setPlay(v => !v)}>{play ? '■ 정지' : '▶ 재생'}</button>}>
            <div className="formula">
              <span className="eq key">OPD = (<i>n</i><sub>x</sub> − <i>n</i><sub>y</sub>)<i>L</i> = Δ<i>n L</i></span>
              <span className="eq">Δ<i>φ</i> = <Fr n="2π" d={<i>λ</i>} />·OPD = <Fr n={<>2π<i>L</i>Δ<i>n</i></>} d={<i>λ</i>} /></span>
              <span className="eq">Δ<i>n</i> = <Fr n={<><i>λ</i>Δ<i>φ</i></>} d={<>2π<i>L</i></>} /></span>
            </div>
            <div className="legend"><span><i style={{ background: 'var(--plot)' }} />Eₓ (굴절률 nₓ)</span><span><i style={{ background: 'var(--plot-2)' }} />Eᵧ (굴절률 nᵧ)</span></div>
            <PolWaves dphi={c.dphi} playing={play} dn={c.dn} />
            <div className="viz-cap">
              출사면 상대 위상 Δφ = <b>{fnum(c.dphi, 4)} rad</b> ≡ <b>{fnum(c.md, 4)} rad</b> (mod 2π) → <b>{c.pol}</b>.
              {c.dn > 0 ? ' nₓ > nᵧ: x 성분의 위상속도 c/nₓ가 더 느려 위상이 뒤처진다.' : c.dn < 0 ? ' nᵧ > nₓ: y 성분이 더 느리다.' : ' nₓ = nᵧ: 두 성분이 같은 속도로 진행한다.'}
            </div>
            <Simplified>
              파동은 개략도이다. 실제 결정 안에는 약 {fnum(nWaves, 3)}개의 파장이 들어 있어 그릴 수 없으므로, 두 성분의 <i>상대</i> 위상이 결정 두께에 비례해 누적되는 모습만 표시했다.
              흡수, 표면 반사, 광학축이 기울어진 경우의 유효 굴절률은 무시했다.
            </Simplified>
          </Panel>
        </div>

        <div className="col col-vals">
          <Panel title="Calculated values">
            <Vals rows={[
              { k: 'nₓ', v: fix(s.nx, 5) },
              { k: 'nᵧ', v: fix(s.ny, 5) },
              { k: 'Δn = nₓ − nᵧ', v: sci(c.dn, 4), hl: true },
              { k: 'OPD = ΔnL', v: fLen(c.opd), hl: true },
              { k: 'Δφ', v: `${fnum(c.dphi, 4)} rad`, hl: true },
              { k: 'Δφ / 2π', v: `${fnum(c.dphi / TAU, 4)} cycle` },
              { k: 'Retardation [rad]', v: `${fnum(c.dphi, 4)} rad` },
              { k: 'Retardation [deg]', v: `${fnum(c.dphi * 180 / PI, 5)}°` },
              { k: 'Retardation [λ]', sub: 'OPD / λ', v: `${fnum(c.N, 4)} λ` },
              { k: '유효 retardation', sub: `차수 m = ${c.order}, 소수부`, v: `${fix(c.fr, 3)} λ` },
              { k: '해당 소자', v: c.plate },
              { k: s.analyzer === 'parallel' ? 'I/I₀ = cos²(Δφ/2)' : 'I/I₀ = sin²(Δφ/2)', sub: '편광자 45°, 검광자 ' + (s.analyzer === 'parallel' ? '평행' : '직교'), v: fix(c.I, 4) },
            ]} />
            <Calc lines={[
              ['OPD', '= (nₓ − nᵧ)L'],
              ['', `= (${fix(s.nx, 5)} − ${fix(s.ny, 5)}) × (${fLen(c.L)})`],
              ['', `= (${sci(c.dn, 4)})(${fLen(c.L)}) = ${fLen(c.opd)}`, true],
              null,
              ['Δφ', '= (2π/λ)·OPD = 2πLΔn / λ'],
              ['', `= 2π(${fLen(c.L)})(${sci(c.dn, 4)}) / (${fLen(c.lam)})`],
              ['', `= ${fnum(c.dphi, 4)} rad = ${fnum(c.dphi * 180 / PI, 5)}°`, true],
              null,
              ['Δn', '= λΔφ / (2πL)  (역산 확인)'],
              ['', `= (${fLen(c.lam)})(${fnum(c.dphi, 4)}) / (2π·${fLen(c.L)}) = ${sci(c.lam * c.dphi / (TAU * c.L), 4)}`],
            ]} />
            <div className="calc">
              <div className="calc-t">Retardation 기준표</div>
              <div className="calc-g">
                <span className="calc-l">Δφ = π/2</span><span className="calc-r">→ λ/4 · 선형 → 원형 편광</span>
                <span className="calc-l">Δφ = π</span><span className="calc-r">→ λ/2 · 편광 방향 대칭 회전</span>
                <span className="calc-l">Δφ = 2π</span><span className="calc-r">→ λ · 원래 편광 상태</span>
              </div>
            </div>
          </Panel>
        </div>
      </div>

      <div className="graphs">
        <Plot title="Graph A · 위상차 Δφ vs Δn" f={fA} x0={-a} x1={a} xScale={scA.s} samples={200}
          xLabel={`Δn = nₓ − nᵧ${scA.lbl}`} yLabel="Δφ (rad)" cur={{ x: c.dn, y: c.dphi }}
          readout={`Δn = ${sci(c.dn, 3)} → Δφ = ${fnum(c.dphi, 4)} rad`} yFmt={v => `${fnum(v, 4)} rad`} xFmt={v => `Δn=${sci(v, 3)}`} />
        <Plot title={`Graph B · 투과 세기 vs Δn (검광자 ${s.analyzer === 'parallel' ? '∥' : '⊥'})`} f={fB} x0={gx0} x1={gx1} xScale={scB.s} samples={2400}
          yDomain={[0, 1.05]} xLabel={`Δn = nₓ − nᵧ${scB.lbl}`} yLabel="I / I₀" cur={{ x: c.dn, y: c.I }}
          readout={`I/I₀ = ${fix(c.I, 4)}`} yFmt={v => `I/I0=${fix(v, 3)}`} xFmt={v => `Δn=${sci(v, 4)}`}
          note={zoom ? `무늬가 너무 조밀해 현재 Δn 주변 ±6주기(±${sci(6 * c.lam / c.L, 2)})만 확대 표시` : `한 주기 = Δn 변화 λ/L = ${sci(c.lam / c.L, 3)}`} />
      </div>

      <Interp>
        <div>
          <p>이방성 결정에서 굴절률은 스칼라가 아니라 유전율 텐서 <span className="m">ε<sub>ij</sub></span>로 결정된다. 주축 좌표계에서 x, y 방향 편광은 각각 굴절률 nₓ, nᵧ를 겪고 위상속도 c/nₓ, c/nᵧ로 진행한다. 같은 두께 <i>L</i>을 지나도 광경로가 nₓL과 nᵧL로 달라서, 두 편광 성분 사이에 OPD = ΔnL의 광경로차가 생긴다.</p>
          <p>이 탭은 한 번 통과(단일 통과)를 다루므로 factor 2가 없다. 결정을 Michelson 팔에 넣어 왕복시키면 OPD = 2ΔnL이 된다. 두 성분을 45° 검광자로 다시 겹치면 서로 간섭하므로, 위상차가 편광 상태와 투과 세기로 바뀐다. 이것이 편광 간섭계와 wave plate의 원리이다.</p>
        </div>
        <div>
          <p><b>결정 대칭성과의 연결.</b> 결정의 굴절률은 유전율 텐서와 관련되고, 결정 대칭성에 따라 방향 의존성이 나타날 수 있다. 그러나 이상적인 cubic crystal(Si, diamond, GaAs 등)은 선형 광학 영역에서 유전율 텐서가 스칼라에 비례하므로 광학적으로 등방적이다. [100], [110], [111] 방향만 바꾼다고 큰 복굴절이 생기지 않는다.</p>
          <p>실제 반도체에서는 <b>strain·stress</b>(광탄성 효과), <b>결정 결함</b>과 전위 주변 응력장, <b>전기장</b>(전기광학 효과), <b>불균일한 carrier 분포</b> 등이 대칭성을 깨면서 복굴절이 생긴다. 이런 작은 Δn(10⁻⁶–10⁻⁴)을 편광 간섭으로 재는 것이 wafer 응력 측정(photoelasticity, 적외선 편광 검사)의 원리이다.</p>
        </div>
      </Interp>
    </>
  );
}

/* ================================================================
   TAB 3A — wafer surface / warpage (reflection: OPD = 2Δh)
   ================================================================ */
const W_DEFAULT = { lambda_nm: 632.8, dh_um: 0, shape: 'bow', A_um: 1.0, tilt_um: 0 };
const WAFER_R_MM = 150;
function waferShape(s) {
  const A = s.A_um * UM, T = s.tilt_um * UM;
  return (xmm, ymm) => {
    const u = xmm / WAFER_R_MM, v = ymm / WAFER_R_MM;
    const tilt = T * u;
    if (s.shape === 'flat') return tilt;
    if (s.shape === 'bow') return A * (u * u + v * v) + tilt;
    return A * (u * u - v * v) + tilt;   // warp: saddle

}
function computeWafer(s) {
  const lam = s.lambda_nm * NM, dh = s.dh_um * UM;

  const h = waferShape(s);

}
function WaferMap({ s, c }) {
  const wrap = useRef(null), cv = useRef(null);

  const theme = useThemeKey();
  const S = clamp(w, 180, 320);
  useEffect(() => {
    const el = cv.current; if (!el) return;
    const { ctx, dpr, W } = setupCanvas(el, S, S);
    const img = ctx.createImageData(W, W);

    const R = W / 2 * 0.94, c0 = W / 2;
    const bgHex = cssVar('--panel') || '#ffffff';
    const tmp = document.createElement('canvas').getContext('2d'); tmp.fillStyle = bgHex; tmp.fillRect(0, 0, 1, 1);
    const bg = tmp.getImageData(0, 0, 1, 1).data;
    for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      const dx = (x - c0) / R, dy = (c0 - y) / R;
      if (dx * dx + dy * dy > 1) { img.data[i] = bg[0]; img.data[i + 1] = bg[1]; img.data[i + 2] = bg[2]; img.data[i + 3] = 255; continue; }
      const hh = c.dh + c.h(dx * WAFER_R_MM, dy * WAFER_R_MM);
      const In = 0.5 * (1 + Math.cos(phaseFromOPD(OPD.reflection(hh), c.lam)));
      const v = (0.06 + 0.94 * Math.pow(In, 0.85)) * 255;
      img.data[i] = cr * v; img.data[i + 1] = cg * v; img.data[i + 2] = cb * v; img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.strokeStyle = cssVar('--ink-2'); ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(cc, cc, Rc, 0, TAU); ctx.stroke();
    ctx.fillStyle = cssVar('--panel'); ctx.beginPath(); ctx.arc(cc, cc + Rc, 5, 0, TAU); ctx.fill();
    ctx.setLineDash([4, 4]); ctx.strokeStyle = 'rgba(255,255,255,.8)';
    ctx.beginPath(); ctx.moveTo(cc - Rc, cc); ctx.lineTo(cc + Rc, cc); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cc, cc, 5, 0, TAU); ctx.stroke();
  }, [s, c.dh, S, theme]);

}

              <span className="eq">fringe 1개 = 높이 <Fr n={<i>λ</i>} d="2" /></span>
            </div>
            <div className="viz-row">

              장파장·grazing incidence·phase-shifting 간섭법으로 측정하며 무늬만으로는 볼록/오목(부호)을 구분할 수 없다.

            <Calc lines={[

      <div className="graphs">
        <Plot title="표면 높이 단면 h(x, y=0)" f={prof} x0={-WAFER_R_MM} x1={WAFER_R_MM} samples={400}

/* ================================================================
   TAB 3B — thin film (air | film | substrate), normal incidence
   ================================================================ */
const FILM_MATS = { SiO2: { l: 'SiO₂', n: 1.457 }, SiN: { l: 'SiNₓ', n: 2.0 }, PR: { l: 'Photoresist', n: 1.64 } };
const SUBS = { Si: { l: 'Si', n: 3.882 }, GaAs: { l: 'GaAs', n: 3.856 }, FS: { l: 'Fused silica', n: 1.457 } };
const F_DEFAULT = { lambda_nm: 632.8, d_nm: 100, mat: 'SiO2', n0: 1.0, n1: 1.457, sub: 'Si', n2: 3.882 };
function filmR(n0, n1, n2, d, lam) {
  const r01 = (n0 - n1) / (n0 + n1), r12 = (n1 - n2) / (n1 + n2);
  const delta = phaseFromOPD(OPD.filmRoundTrip(n1, d), lam);   // = 4π n1 d / λ
  const c = Math.cos(delta), s = Math.sin(delta);
  const nr = r01 + r12 * c, ni = -r12 * s, dr = 1 + r01 * r12 * c, di = -r01 * r12 * s;
  return (nr * nr + ni * ni) / (dr * dr + di * di);
}
const gl = (x, mu, s1, s2) => { const t = (x - mu) / (x < mu ? s1 : s2); return Math.exp(-0.5 * t * t); };
const cmf = l => [
  1.056 * gl(l, 599.8, 37.9, 31.0) + 0.362 * gl(l, 442.0, 16.0, 26.7) - 0.065 * gl(l, 501.1, 20.4, 26.2),
  0.821 * gl(l, 568.8, 46.9, 40.5) + 0.286 * gl(l, 530.9, 16.3, 31.1),
  1.217 * gl(l, 437.0, 11.8, 36.0) + 0.681 * gl(l, 459.0, 26.0, 13.8)];
function filmColor(Rfn) {
  let X = 0, Y = 0, Z = 0, Xw = 0, Yw = 0, Zw = 0;
  for (let l = 380; l <= 780; l += 5) { const [x, y, z] = cmf(l); const r = Rfn(l * NM); X += r * x; Y += r * y; Z += r * z; Xw += x; Yw += y; Zw += z; }
  const lin = (X, Y, Z) => [3.2406 * X - 1.5372 * Y - 0.4986 * Z, -0.9689 * X + 1.8758 * Y + 0.0415 * Z, 0.0557 * X - 0.2040 * Y + 1.0570 * Z];
  const cc = lin(X, Y, Z), ww = lin(Xw, Yw, Zw);
  const rgb = cc.map((v, i) => Math.max(0, v / ww[i]));
  const mx = Math.max(...rgb, 1e-6), k = 0.92 / mx;
  const enc = v => { v = clamp(v * k, 0, 1); return Math.round(255 * (v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055)); };
  return { css: `rgb(${rgb.map(enc).join(',')})`, Y: Y / Yw };
}
function computeFilm(s) {
  const lam = s.lambda_nm * NM, d = s.d_nm * NM;
  const opd = OPD.filmRoundTrip(s.n1, d), dphi = phaseFromOPD(opd, lam), N = fringeNumber(opd, lam);
  const r01 = (s.n0 - s.n1) / (s.n0 + s.n1), r12 = (s.n1 - s.n2) / (s.n1 + s.n2);
  const R = filmR(s.n0, s.n1, s.n2, d, lam);
  const Reven = ((r01 + r12) / (1 + r01 * r12)) ** 2, Rodd = ((r01 - r12) / (1 - r01 * r12)) ** 2;
  const period = lam / (2 * s.n1);
  const col = filmColor(l => filmR(s.n0, s.n1, s.n2, d, l));
  return { lam, d, opd, dphi, N, r01, r12, R, Reven, Rodd, period, col, Rbare: ((s.n0 - s.n2) / (s.n0 + s.n2)) ** 2 };
}
function FilmStack({ s, c }) {
  const hf = 16 + 84 * clamp(s.d_nm / 2000, 0, 1);
  const y1 = 72, y2 = y1 + hf;
  const beam = wlColor(s.lambda_nm).css;

  return (
    <svg viewBox="0 0 380 230" width="100%" style={{ maxWidth: 460, display: 'block' }} role="img" aria-label="박막 단면 구조와 반사 광선">

          <p>이것은 Michelson의 거울 변위와 같은 구조이다. 막 안의 왕복 광경로가 두께의 두 배라는 점(factor 2)과, 막 안에서는 파장이 λ/n₁로 짧아진다는 점(factor n₁)이 함께 들어간다.</p>
        </div>
        <div>
          <p>그러나 위상만으로는 밝음·어둠이 결정되지 않는다. 낮은 굴절률에서 높은 굴절률 계면으로 반사될 때 반사계수가 음수가 되어 π 위상이 더해진다. SiO₂/Si처럼 두 계면 모두 π 반전이면 서로 상쇄되지만, 한 계면에서만 반전되면 극대·극소 조건이 반 주기 이동한다.</p>
          <p>또 반사계수의 크기가 두 빔의 세기 비를 정하므로 대비(fringe contrast)가 달라지고, 막 안의 다중 반사가 곡선 모양을 바꾼다. 위의 Fresnel 식은 이 효과를 모두 포함한 정상 입사 결과이다. 실제 ellipsometry는 여기에 경사 입사, 편광(s/p), 흡수(복소 굴절률)까지 넣어 분석한다.</p>
        </div>
      </Interp>
    </>
  );
}

          <Plot title="Graph B · I/I_max vs Δd" f={x => 0.5 * (1 + Math.cos(phaseFromOPD(OPD.reflection(x * UM), lam)))} x0={-1} x1={1} samples={1600} yDomain={[0, 1.05]}
            xLabel="변위 Δd (μm)" yLabel="I / I_max" cur={{ x: s.dd_um, y: In }}
            readout={`I/I_max = ${fix(In, 4)}`} yFmt={v => `I=${fix(v, 3)}`} xFmt={v => `Δd=${fnum(v, 4)} μm`}

        </>}
      </div>
      <Interp>
        <div>
          <p>MEMS 구조물이 Δd 움직이면 반사된 빛의 경로는 왕복이므로 2Δd 변하고, 위상은 4πΔd/λ만큼 변한다. 변위가 λ/2(632.8 nm에서 316 nm)일 때 검출기 세기가 한 주기를 돈다. 위상 분해능이 1 mrad이면 변위 분해능은 λ·10⁻³/(4π) ≈ 0.05 nm로, 원자 크기보다 작다.</p>
        </div>
        <div>
          <p>진동하는 membrane은 반사광의 <b>위상을 변조</b>하고, 간섭은 이 위상 변조를 <b>세기 변조</b>로 바꾼다. cos 곡선의 기울기가 가장 큰 quadrature 점(d₀ = λ/8)에서 작은 진동은 세기에 선형으로 옮겨진다. d₀ = 0처럼 극대점에 있으면 cos의 평평한 부분이라 응답이 2차가 되어 I(t)가 2f로 진동한다. 진폭이 λ/4보다 크면 여러 fringe가 지나가므로 fringe를 세거나 위상을 풀어(unwrap) 진폭을 구한다.</p>
        </div>
      </Interp>
    </>
  );
}

      one: sci(lam / (2 * L), 3), min: sci(lam * dphiMin / (4 * PI * L), 3), cur: `Δn=${sci(st.t1[0].dn, 2)} → ${fLen(t1.opd, 3)}, ${fnum(t1.dphi, 3)} rad` },
    { name: '복굴절 (단일 통과)', q: 'Δn = nₓ − nᵧ', opd: 'LΔn', ph: '2πLΔn/λ', x2: false,
      one: sci(lam / L, 3), min: sci(lam * dphiMin / (TAU * L), 3), cur: `Δn=${sci(t2.dn, 2)} → ${fLen(t2.opd, 3)}, ${fnum(t2.dphi, 3)} rad` },
    { name: '표면 또는 거울 변위 (반사)', q: 'Δd, Δh', opd: '2Δd', ph: '4πΔd/λ', x2: true,
      one: fLen(lam / 2, 3), min: fLen(lam * dphiMin / (4 * PI), 3), cur: `wafer Δh=${fLen(w.dh, 3)} → ${fnum(w.dphi, 3)} rad · MEMS Δd=${fLen(m.dd_um * UM, 3)} → ${fnum(mPh, 3)} rad` },
    { name: '반도체 effective index 변화 (MZI 한 팔)', q: 'Δn_eff', opd: 'LΔn_eff', ph: '2πLΔn_eff/λ', x2: false,
      one: sci(lam / L, 3), min: sci(lam * dphiMin / (TAU * L), 3), cur: `Δn_eff=${sci(md.dneff, 2)} → ${fLen(dOPD, 3)}, ${fnum(dPh / PI, 3)}π` },
    { name: '박막 두께 (참고: 계면 위상 별도)', q: 'd (막 두께)', opd: '≈ 2n₁d', ph: '4πn₁d/λ', x2: true,
      one: `Δd = ${fLen(lam / (2 * st.film[0].n1), 3)}`, min: fLen(lam * dphiMin / (4 * PI * st.film[0].n1), 3), cur: `d=${fLen(f.d, 3)} → ${fnum(f.dphi, 3)} rad, R=${fix(f.R * 100, 1)}%` },
  ];
  const flow = [
    { t: 'Physical change', d: '굴절률, 결정 이방성, 표면 높이, 구조물 변위, 막 두께, 유효굴절률', ex: `예 (탭 1): Δn = ${sci(st.t1[0].dn, 3)}` },
    { t: 'Optical Path Difference', d: '물리적 변화 × 통과 횟수 (반사·왕복이면 ×2)', ex: `OPD = 2LΔn = ${fLen(t1.opd)}` },
    { t: 'Phase Difference', d: '모든 경우 같은 식: Δφ = (2π/λ)·OPD', ex: `Δφ = ${fnum(t1.dphi, 4)} rad = 2π × ${fnum(t1.N, 4)}` },
    { t: 'Interference Intensity / Fringe Shift', d: 'I = I₁ + I₂ + 2√(I₁I₂) cos Δφ, fringe 수 N = Δφ/2π', ex: `I/I_max = ${fix(t1.In, 3)}, N = ${fnum(t1.N, 4)}` },
    { t: 'Measured physical quantity', d: '관측한 N 또는 Δφ를 거꾸로 풀어 물리량을 얻는다', ex: `Δn = Nλ/(2L) = ${sci(t1.N * t1.lam / (2 * t1.L), 3)}` },
  ];
  return (
    <>
      <div className="tbl-wrap" style={{ marginTop: 14 }}>
        <table className="sum">
          <thead><tr>
            <th>현상</th><th>변화하는 물리량</th><th>OPD</th><th>Phase Δφ</th><th>fringe 1개에 해당하는 변화</th><th>검출 한계 (δN = {fix(p.eps, 3)})</th><th>현재 각 탭 설정</th>
          </tr></thead>
          <tbody>
            {rows.map(r => (
              <tr key={r.name}>
                <td>{r.name}</td>
                <td>{r.q}</td>
                <td className="f">{r.opd}{r.x2 && <span className="x2">×2 왕복</span>}</td>
                <td className="f">{r.ph}</td>
                <td className="n">{r.one}</td>
                <td className="n">{r.min}</td>
                <td className="n" style={{ whiteSpace: 'normal', minWidth: 220 }}>{r.cur}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="keyline">
        모든 측정은 결국 Optical Path Difference를 Phase Difference로 변환하여 측정한다.
        <small>Δφ = (2π/λ)·OPD, N = OPD/λ = Δφ/2π. 현상마다 다른 것은 OPD의 모양(왕복이면 factor 2, 매질 안이면 굴절률 곱)뿐이다.</small>
      </div>
      <div className="two">
        <Panel title="Measurement chain">
          <div className="flow">
            {flow.map((f, i) => (
              <React.Fragment key={f.t}>
                {i > 0 && <div className="dn" aria-hidden="true">↓</div>}
                <div className="st"><span className="k">{i + 1}</span><div><div className="t">{f.t}</div><div className="d">{f.d}</div><div className="ex">{f.ex}</div></div></div>
              </React.Fragment>
            ))}
          </div>
        </Panel>
        <Panel title="감도 비교 계산기">
          <div className="viz-cap">표의 “fringe 1개”와 “검출 한계” 열은 아래 값으로 계산된다. 검출 한계는 위상을 fringe의 δN 만큼 분해할 수 있을 때 잡히는 최소 변화량이다.</div>
          <Slider id="s-lam" label="파장 λ" value={p.lambda_nm} onChange={up('lambda_nm')} min={400} max={1700} step={0.1} dec={1} unit="nm" />
          <Slider id="s-L" label="시료 / 소자 길이 L" value={p.L_mm} onChange={up('L_mm')} min={0.1} max={10} step={0.01} dec={2} unit="mm" />
          <Slider id="s-eps" label="위상 분해능 δN (fringe 분율)" value={p.eps} onChange={up('eps')} min={0.001} max={0.2} step={0.001} dec={3} unit="fringe"
            note={`δφ = 2π·δN = ${fnum(dphiMin * 1e3, 3)} mrad`} />
          <Vals rows={[
            { k: '최소 검출 변위 (반사)', sub: 'λδφ/(4π)', v: fLen(lam * dphiMin / (4 * PI)), hl: true },
            { k: '최소 검출 Δn (Michelson 왕복)', sub: 'λδφ/(4πL)', v: sci(lam * dphiMin / (4 * PI * L), 3), hl: true },
            { k: '최소 검출 Δn (단일 통과)', sub: 'λδφ/(2πL)', v: sci(lam * dphiMin / (TAU * L), 3) },
          ]} />
        </Panel>
      </div>
      <Interp>
        <div>
          <p>Michelson 간섭계는 파장을 재는 장치로 처음 배우지만, 파장을 알고 있을 때는 거꾸로 λ를 <b>눈금자</b>로 삼아 아주 작은 광경로 변화를 재는 장치가 된다. fringe 하나가 λ/2의 변위(약 316 nm)에 해당하고, 위상을 fringe의 1/100–1/1000까지 읽으면 Å 이하의 변위와 10⁻⁷ 수준의 굴절률 변화를 측정할 수 있다.</p>
        </div>
        <div>
          <p>현상마다 달라 보이는 식은 모두 Δφ = (2π/λ)·OPD의 특수한 경우이다. 반사면이나 왕복 경로에는 factor 2가 붙고, 매질 안 경로에는 굴절률이 곱해진다. 박막처럼 계면 반사가 섞이는 경우에만 Fresnel 계수에 의한 추가 위상과 세기 비를 고려하면 된다. 반도체 계측(평탄도, 막 두께, 응력, MEMS 진동)과 광소자(변조기, 스위치)는 모두 이 한 원리 위에 있다.</p>
        </div>
      </Interp>
    </>
  );
}

/* ================================================================
   APP
   ================================================================ */
const TABS = [
  { id: 't1', no: '1', l: '굴절률 변화에 따른 Michelson 간섭' },
  { id: 't2', no: '2', l: '결정의 광학적 이방성과 복굴절' },
  { id: 't3', no: '3', l: '반도체 공정 및 소자 응용' },
  { id: 't4', no: '4', l: '전체 비교 / 종합' },
];
function App() {
  const init = (() => { try { const v = localStorage.getItem('mpl-tab'); return TABS.some(t => t.id === v) ? v : 't1'; } catch (e) { return 't1'; } })();
  const [tab, setTab] = useState(init);
  const [sub, setSub] = useState('A');
  const st = {
    t1: useState(T1_DEFAULT), t2: useState(T2_DEFAULT),
    wafer: useState(W_DEFAULT), film: useState(F_DEFAULT), mems: useState(M_DEFAULT), mod: useState(D_DEFAULT),
  };
  const go = id => { setTab(id); try { localStorage.setItem('mpl-tab', id); } catch (e) {} };
  return (
    <div className="app">
      <header className="top">
        <div>
          <div className="kicker">기초광학실험 · Michelson interferometry extension</div>
          <h1>Michelson 위상 계측 시뮬레이터</h1>
        </div>
        <div className="chain" aria-label="측정 원리">
          <span className="node">물리적 변화</span><span className="arr">→</span>
          <span className="node">OPD</span><span className="arr">→</span>
          <span className="node">Δφ = (2π/λ)·OPD</span><span className="arr">→</span>
          <span className="node">간섭무늬 변화</span>
        </div>
      </header>
      <nav className="tabs" role="tablist" aria-label="시뮬레이션 탭">
        {TABS.map(t => (
          <button key={t.id} type="button" role="tab" className="tab" aria-selected={tab === t.id} onClick={() => go(t.id)}>
            <span className="no">{t.no}</span>{t.l}
          </button>
        ))}
      </nav>
      {tab === 't1' && <Tab1 s={st.t1[0]} set={st.t1[1]} />}
      {tab === 't2' && <Tab2 s={st.t2[0]} set={st.t2[1]} />}
      {tab === 't3' && <Tab3 sub={sub} setSub={setSub} st={st} />}
      {tab === 't4' && <Tab4 st={st} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
